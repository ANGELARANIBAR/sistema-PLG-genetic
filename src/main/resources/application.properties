# SERVER CONFIG
server.port=8080

# DATASOURCE CONFIG
spring.datasource.url=jdbc:mysql://plg-bd.cfmm86mqm8tx.us-east-1.rds.amazonaws.com:3306/final?useSSL=false&serverTimezone=America/Lima&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=10
