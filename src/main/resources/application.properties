# SERVER CONFIG
server.port=8080

# DATASOURCE CONFIG
spring.datasource.url=jdbc:mysql://plg-bd.cfmm86mqm8tx.us-east-1.rds.amazonaws.com:3306/final?useSSL=false&serverTimezone=America/Lima&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&initialTimeout=10&connectTimeout=60000&socketTimeout=0&tcpKeepAlive=true&useUnicode=true&characterEncoding=UTF-8&allowMultiQueries=true&rewriteBatchedStatements=true&useCursorFetch=true&defaultFetchSize=1000&useLegacyDatetimeCode=false&sessionVariables=innodb_lock_wait_timeout=300
spring.datasource.username=admin
spring.datasource.password=sistema-plg
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.time-zone=America/Lima

# HIKARICP CONNECTION POOL CONFIG - Optimized for long-running genetic algorithm
spring.datasource.hikari.pool-name=PlanificacionHikariPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.keepalive-time=300000

# JPA CONFIG - Optimized for genetic algorithm operations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.connection.isolation=1
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.connection.handling_mode=delayed_acquisition_and_release_after_statement
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# TRANSACTION CONFIG - Extended timeouts for genetic algorithm
spring.jpa.properties.hibernate.current_session_context_class=org.springframework.orm.hibernate5.SpringSessionContext
spring.transaction.default-timeout=7200
spring.jpa.open-in-view=false

# LOGGING CONFIG - Enhanced for debugging simulation issues
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.com.zaxxer.hikari.HikariConfig=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.engine.transaction=DEBUG
logging.level.org.hibernate.resource.transaction=DEBUG
logging.level.com.plg.planificacionplg=DEBUG

# MySQL and Connection specific logging
logging.level.com.mysql.cj.jdbc=WARN
logging.level.com.mysql.cj.protocol=WARN

# ASYNC PROCESSING CONFIG for genetic algorithm
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=500
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=genetic-algo-
spring.task.scheduling.pool.size=5

# JVM OPTIMIZATION for long-running processes
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.properties.hibernate.connection.acquisition_mode=as_needed
spring.jpa.properties.hibernate.connection.release_mode=after_transaction

# DEADLOCK PREVENTION
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.order_by.default_null_ordering=last
