# SERVER CONFIG
server.port=8080

# DATASOURCE CONFIG
spring.datasource.url=jdbc:mysql://plg-bd.cfmm86mqm8tx.us-east-1.rds.amazonaws.com:3306/final?useSSL=false&serverTimezone=America/Lima
spring.datasource.username=admin
spring.datasource.password=sistema-plg
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jackson.time-zone=America/Lima
spring.datasource.hikari.maximum-pool-size=15 
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.keepalive-time=150000
